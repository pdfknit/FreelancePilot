<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}FreelancePilot{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<header class="nav" role="banner" aria-label="Главная навигация">
  <div class="nav-inner">
    <a href="/" class="logo"><img src="{% static 'brand/logo.svg' %}" alt="FreelancePilot" height="28"></a>
    <nav class="nav-links">
      <a href="/chat/">Чат</a>
      <a href="/tasks/">Задачи</a>
      <a href="/reports/">Отчёты</a>
      <a href="/settings/">Настройки</a>
      {% if user.is_authenticated %}
        <a href="/accounts/logout/">Выйти</a>
      {% else %}
        <a href="/accounts/login/">Войти</a>
      {% endif %}
    </nav>
  </div>
</header>

<main id="content">{% block content %}{% endblock %}</main>

<footer class="footer">© {% now "Y" %} FreelancePilot</footer>
</body>
</html>
